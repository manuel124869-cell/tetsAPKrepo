name: Build libusb arm64-v8a

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup environment
        run: |
          echo "TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "TARGET=aarch64-linux-android" >> $GITHUB_ENV
          echo "API=24" >> $GITHUB_ENV
          echo "PREFIX=$GITHUB_WORKSPACE/install-arm64" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Extract libusb tarball
        run: |
          ls -la
          echo "=== Extrayendo libusb-1.0.30.tar.gz ==="
          tar -xzf libusb-1.0.30.tar.gz
          echo "=== Contenido ==="
          ls -la libusb-1.0.30/
          echo "=== ¿Existe configure? ==="
          ls -la libusb-1.0.30/configure 2>/dev/null || echo "NO existe configure — hay que generarlo"
          ls -la libusb-1.0.30/configure.ac 2>/dev/null && echo "configure.ac SÍ existe"

      - name: Generate configure (autoreconf)
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH

          cd libusb-1.0.30

          # Generar el configure con autoreconf
          autoreconf -fiv

          echo "=== Después de autoreconf ==="
          ls -la configure
          ls -la Makefile.in 2>/dev/null || true

      - name: Build libusb for arm64-v8a
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          cd libusb-1.0.30

          ./configure \
            --build=x86_64-linux-gnu \
            --host=$TARGET \
            --prefix=$PREFIX \
            --enable-shared \
            --disable-static \
            --disable-udev \
            --disable-timerfd \
            --disable-examples-build \
            --disable-tests-build

          # Quitar -lpthread de los Makefiles generados (Android lo incluye en libc)
          find . -name "Makefile" -exec sed -i 's/-lpthread//g' {} \;
          find . -name "*.la" -exec sed -i 's/-lpthread//g' {} \; 2>/dev/null || true

          make -j$(nproc)
          make install

      - name: Verify output
        run: |
          echo "=== Contenido de install-arm64 ==="
          find $PREFIX -type f | sort
          echo ""
          echo "=== Arquitectura de la .so ==="
          file $PREFIX/lib/libusb-1.0.so* 2>/dev/null || true
          echo ""
          echo "=== Dependencias ==="
          readelf -d $PREFIX/lib/libusb-1.0.so* 2>/dev/null | grep NEEDED || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libusb-arm64-v8a
          path: install-arm64/
          if-no-files-found: error
