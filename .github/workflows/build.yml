name: Build libimobiledevice arm64-v8a

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup environment
        run: |
          echo "TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "TARGET=aarch64-linux-android" >> $GITHUB_ENV
          echo "API=24" >> $GITHUB_ENV
          echo "PREFIX=$GITHUB_WORKSPACE/install-arm64" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Extract all tarballs
        run: |
          for f in *.tar.bz2; do
            echo "=== Extracting $f ==="
            tar -xjf "$f"
          done
          ls -d */

      - name: Build OpenSSL for arm64-v8a
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          wget -q https://www.openssl.org/source/openssl-3.0.15.tar.gz
          tar -xzf openssl-3.0.15.tar.gz
          cd openssl-3.0.15
          ./Configure android-arm64 \
            -D__ANDROID_API__=$API \
            --prefix=$PREFIX \
            --openssldir=$PREFIX/ssl \
            shared
          make -j$(nproc)
          make install_sw

      - name: Build zlib for arm64-v8a
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CHOST=$TARGET
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export CFLAGS="-fPIC -O2 -D__ANDROID_API__=$API"

          wget -q https://zlib.net/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1

          ./configure --prefix=$PREFIX --static

          # Forzar compilador y herramientas en el Makefile generado
          sed -i "s|^CC=.*|CC=$CC|" Makefile
          sed -i "s|^AR=.*|AR=$AR|" Makefile
          sed -i "s|^RANLIB=.*|RANLIB=$RANLIB|" Makefile

          make -j$(nproc) libz.a

          mkdir -p $PREFIX/lib $PREFIX/include $PREFIX/lib/pkgconfig
          cp libz.a $PREFIX/lib/
          cp zlib.h zconf.h $PREFIX/include/

          cat > $PREFIX/lib/pkgconfig/zlib.pc <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          sharedlibdir=\${libdir}
          includedir=\${prefix}/include

          Name: zlib
          Description: zlib compression library
          Version: 1.3.1

          Requires:
          Libs: -L\${libdir} -lz
          Cflags: -I\${includedir}
          EOF

          echo "=== Verificando zlib.pc ==="
          cat $PREFIX/lib/pkgconfig/zlib.pc
          ls -la $PREFIX/lib/libz.a

      - name: Build libplist
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig

          cd libplist-2.7.0
          ./configure --build=x86_64-linux-gnu --host=$TARGET --prefix=$PREFIX \
            --enable-shared --disable-static --without-cython
          make -j$(nproc)
          make install

      - name: Build libcurl for arm64-v8a
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"

          wget -q https://curl.se/download/curl-8.10.1.tar.gz
          tar -xzf curl-8.10.1.tar.gz
          cd curl-8.10.1

          ./configure \
            --host=$TARGET \
            --build=x86_64-linux-gnu \
            --prefix=$PREFIX \
            --enable-shared \
            --disable-static \
            --with-openssl=$PREFIX \
            --with-zlib=$PREFIX \
            --without-libpsl \
            --without-brotli \
            --without-zstd \
            --without-libidn2 \
            --without-librtmp \
            --without-nghttp2 \
            --disable-ftp \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-manual \
            --disable-verbose

          make -j$(nproc)
          make install

          echo "=== Verificando libcurl.pc ==="
          cat $PREFIX/lib/pkgconfig/libcurl.pc | head -30

      - name: Build libimobiledevice-glue
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig

          cd libimobiledevice-glue-1.3.2
          ./configure --build=x86_64-linux-gnu --host=$TARGET --prefix=$PREFIX \
            --enable-shared --disable-static
          make -j$(nproc)
          make install

      - name: Build libtatsu
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig

          cd libtatsu-1.0.5
          ./configure --build=x86_64-linux-gnu --host=$TARGET --prefix=$PREFIX \
            --enable-shared --disable-static
          make -j$(nproc)
          make install

      - name: Build libusbmuxd
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig

          cd libusbmuxd-2.1.1
          ./configure --build=x86_64-linux-gnu --host=$TARGET --prefix=$PREFIX \
            --enable-shared --disable-static --without-cython
          make -j$(nproc)
          make install

      - name: Build libimobiledevice
        run: |
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig

          cd libimobiledevice-1.4.0
          ./configure --build=x86_64-linux-gnu --host=$TARGET --prefix=$PREFIX \
            --enable-shared --disable-static --without-cython
          make -j$(nproc)
          make install

      - name: Verify output
        run: |
          echo "=== Contenido de install-arm64 ==="
          find $PREFIX -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-arm64-v8a
          path: install-arm64/
          if-no-files-found: error
